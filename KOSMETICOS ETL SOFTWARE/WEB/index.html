<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosmeticos ETL API - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER / NAVBAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-pink-500 p-2 rounded-xl text-white">
                <i data-lucide="layers" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-800 leading-none">Kosmeticos ETL</h1>
                <p class="text-xs text-slate-400 mt-1">Generador y Procesador de Catálogos</p>
            </div>
        </div>
        <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
            <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">

        <!-- SECCIÓN ARCHIVO SELECCIONADO -->
        <section class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <span class="text-xs font-bold text-pink-500 uppercase tracking-wider">Archivo Preparado</span>
                <h2 id="active-file-text" class="text-xl font-bold text-slate-700 mt-1 flex items-center">
                    <i data-lucide="file-question" class="w-6 h-6 inline-block mr-2 text-slate-400"></i>
                    Ningún archivo seleccionado
                </h2>
            </div>
            <div class="flex flex-wrap gap-3">
                <label class="px-4 py-2.5 bg-pink-500 hover:bg-pink-600 text-white rounded-xl text-sm font-semibold flex items-center gap-2 cursor-pointer transition-all shadow-sm">
                    <i data-lucide="upload" class="w-4 h-4"></i> Seleccionar Excel de PC
                    <input type="file" id="local-excel-input" accept=".xlsx, .xls" class="hidden" onchange="seleccionarArchivoLocal(this)">
                </label>
            </div>
        </section>

        <!-- SECCIÓN DE ACCIONES DE PROCESAMIENTO -->
        <section class="space-y-4">
            <h3 class="font-bold text-slate-700 text-lg">Procesar y Cruzar con Diccionarios</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <button onclick="ejecutarProcesamiento()" class="p-5 bg-white border border-slate-200 rounded-2xl hover:border-pink-400 hover:shadow-md transition-all text-left group">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold text-slate-800 group-hover:text-pink-600">Procesar Archivo</span>
                        <i data-lucide="cpu" class="w-5 h-5 text-slate-400 group-hover:text-pink-500"></i>
                    </div>
                    <p class="text-xs text-slate-400">Envia el Excel al servidor y cruza SKU_Variante con ISP y Precios.</p>
                </button>

            </div>
        </section>

    </main>

    <!-- SIDEBAR DEV & HERRAMIENTAS -->
    <aside id="sidebar" class="fixed right-0 top-0 h-full w-80 bg-white border-l border-slate-200 z-40 p-6 transform translate-x-full transition-transform duration-300 shadow-xl overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
            <h3 class="font-bold text-slate-800">Herramientas & Plantillas</h3>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Plantillas Disponibles</label>
                <button onclick="downloadTemplate()" class="w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-xl flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="file-down" class="w-4 h-4"></i> Descargar Plantilla Base
                </button>
            </div>
        </div>
    </aside>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // La API apunta al origen actual (para Render o Localhost)
        const API_URL = window.location.origin;
        let archivoParaSubir = null;

        // Fetch wrapper con Token
        async function fetchConAuth(url, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`
            };
            return await fetch(url, { ...options, headers });
        }

        // Sistema de Notificaciones Toast
        function showToast(mensaje, tipo = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colores = {
                info: 'bg-slate-800 text-white',
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white'
            };
            toast.className = `px-4 py-3 rounded-xl shadow-lg text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${colores[tipo] || colores.info}`;
            toast.textContent = mensaje;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('translate-x-full');
        }

        function seleccionarArchivoLocal(inputElement) {
            if (!inputElement.files.length) return;
            archivoParaSubir = inputElement.files[0];
            document.getElementById('active-file-text').innerHTML = `<i data-lucide="check-circle-2" class="w-6 h-6 inline-block mr-2 text-pink-500 mb-1"></i> ${archivoParaSubir.name}`;
            lucide.createIcons();
            showToast(`Archivo "${archivoParaSubir.name}" preparado.`, "success");
        }

        // DESCARGA DE PLANTILLA (Sincronizado con /api/plantillas/lista y /api/plantillas/descargar)
        async function downloadTemplate() {
            try {
                showToast("Consultando plantillas...", "info");
                const res = await fetch(`${API_URL}/api/plantillas/lista`);
                if (!res.ok) throw new Error("No se pudo obtener la lista de plantillas");
                
                const plantillas = await res.json();
                if (!plantillas || plantillas.length === 0) {
                    showToast("No hay plantillas guardadas en la carpeta Plantillas del servidor.", "error");
                    return;
                }

                // Descarga la primera plantilla disponible
                const nombrePlantilla = plantillas[0];
                window.location.href = `${API_URL}/api/plantillas/descargar/${encodeURIComponent(nombrePlantilla)}`;
                showToast(`Descargando plantilla: ${nombrePlantilla}`, "success");
            } catch (e) {
                showToast("Error al conectar con el servidor de plantillas.", "error");
            }
        }

        // PROCESAR ARCHIVO (Sincronizado con /api/procesar)
        async function ejecutarProcesamiento() {
            if (!archivoParaSubir) {
                showToast("Primero selecciona un archivo Excel de tu PC.", "error");
                return;
            }

            const formData = new FormData();
            formData.append("file", archivoParaSubir);

            try {
                showToast(`Procesando ${archivoParaSubir.name}...`, "info");
                const res = await fetchConAuth(`${API_URL}/api/procesar`, {
                    method: 'POST',
                    body: formData
                });

                if (res.status === 401) {
                    showToast("Sesión expirada o no autenticada. Inicia sesión de nuevo.", "error");
                    setTimeout(() => { window.location.href = "/login"; }, 2000);
                    return;
                }

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Error en el servidor");
                }

                const data = await res.json();
                showToast(`¡Listo! Se procesaron ${data.filas_procesadas} filas.`, "success");

                // Iniciar descarga del resultado procesado
                if (data.download_url) {
                    window.location.href = `${API_URL}${data.download_url}`;
                }

            } catch (error) {
                showToast(`Error: ${error.message}`, "error");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
